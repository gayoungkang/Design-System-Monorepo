name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_CACHE_BUSTER: v6

jobs:
  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.11.0 --activate
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build

      - name: Require changeset for package changes
        run: |
          BASE_REF="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1

          CHANGED_FILES=$(git diff --name-only "$BASE_REF"...HEAD)

          echo "Changed files:"
          echo "$CHANGED_FILES"

          REQUIRES_CHANGESET=false

          while IFS= read -r file; do
            if [[ "$file" == packages/* ]] || [[ "$file" == .changeset/config.json ]]; then
              REQUIRES_CHANGESET=true
              break
            fi
          done <<< "$CHANGED_FILES"

          if [[ "$REQUIRES_CHANGESET" == "false" ]]; then
            echo "No package changes detected. Skipping changeset requirement."
            exit 0
          fi

          HAS_CHANGESET=false

          while IFS= read -r file; do
            if [[ "$file" == .changeset/*.md ]]; then
              HAS_CHANGESET=true
              break
            fi
          done <<< "$CHANGED_FILES"

          if [[ "$HAS_CHANGESET" == "false" ]]; then
            echo "Changeset required for package changes, but no .changeset/*.md file was found."
            exit 1
          fi

          echo "Changeset detected."

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.11.0 --activate
          yarn --version

      - name: Sanitize Yarn legacy env
        run: |
          unset cacheVersion || true
          unset CACHEVERSION || true
          unset YARN_CACHE_VERSION || true
          unset yarn_cacheVersion || true
          unset YARN_CACHE_FOLDER || true

      - name: Patch .yarnrc.yml for CI (remove legacy keys)
        run: |
          if [ -f .yarnrc.yml ]; then
            cp .yarnrc.yml .yarnrc.yml.ci
            sed -i '/^[[:space:]]*cacheVersion:[[:space:]]*/d' .yarnrc.yml.ci
            mv .yarnrc.yml.ci .yarnrc.yml
          fi

      - name: Cache Yarn packages (Berry)
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ env.CI_CACHE_BUSTER }}-${{ hashFiles('**/yarn.lock') }}

      - name: Force npm registry (Yarn Berry)
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          yarn config set npmRegistryServer https://registry.npmjs.org
          yarn config set npmAlwaysAuth false
          if [ -n "$YARN_NPM_AUTH_TOKEN" ]; then
            yarn config set npmAlwaysAuth true
            yarn config set npmAuthToken "$YARN_NPM_AUTH_TOKEN"
          fi

      - name: Install dependencies
        run: |
          rm -rf node_modules
          rm -rf .yarn/unplugged .yarn/install-state.gz .pnp.cjs .pnp.data.json
          yarn cache clean --all || true
          yarn install --immutable --mode=skip-build

      - name: Build icon assets (types + sprite)
        run: yarn icons:build

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: UI tests (Vitest)
        run: yarn workspace @acme/ui test:run

      - name: Build @acme/ui (for Storybook and API Extractor)
        run: yarn workspace @acme/ui build

      - name: Storybook CI
        run: yarn storybook:ci

      - name: Ensure API Extractor folders
        run: mkdir -p packages/ui/etc

      - name: Patch API Extractor entrypoint to dist d.ts
        working-directory: packages/ui
        run: |
          node - <<'NODE'
           const fs = require("fs");
           const path = require("path");

           const file = path.resolve(process.cwd(), "api-extractor.json");
           const json = JSON.parse(fs.readFileSync(file, "utf8"));

           json.mainEntryPointFilePath = "<projectFolder>/dist/index.d.ts";

           fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
           console.log("Patched api-extractor.json mainEntryPointFilePath:", json.mainEntryPointFilePath);
           NODE

      - name: Debug API Extractor inputs
        run: |
          ls -la packages/ui/dist || true
          test -f packages/ui/dist/index.d.ts && echo "index.d.ts exists" || (echo "index.d.ts missing" && exit 1)
          grep -nE 'src/|\.ts"|\.ts;' packages/ui/dist/index.d.ts | head -n 50 || true

      - name: API stability (API Extractor)
        run: yarn workspace @acme/ui api:check

      - name: Build (apps/web)
        run: yarn build

      - name: Bundle budget check
        run: yarn build:check
